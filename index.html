<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Assignment Planner</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h1>📚 Assignment Planner</h1>

<div class="stats">

<div class="card">

<p>Total</p>

<h2 id="total">0</h2>

</div>

<div class="card">

<p>Pending</p>

<h2 id="pending">0</h2>

</div>

<div class="card">

<p>Done</p>

<h2 id="done">0</h2>

</div>

</div>

<input
id="title"
placeholder="Assignment title">

<input
id="subject"
placeholder="Subject">

<input
id="date"
type="date">

<select id="priority">

<option>High</option>

<option>Medium</option>

<option>Low</option>

</select>

<button
onclick="addTask()">

Add Assignment

</button>

<ul id="taskList">

</ul>

</div>

<script
src="script.js">

</script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Assignment Planner</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="phone">

<div class="header">

<div>

<h1>Hello Sayantani 👋</h1>

<p>Manage your assignments</p>

</div>

<div class="dateBox">

<h3 id="todayDate"></h3>

</div>

</div>

<div class="stats">

<div class="card">

<h2 id="total">0</h2>

<p>Total</p>

</div>

<div class="card">

<h2 id="pending">0</h2>

<p>Pending</p>

</div>

<div class="card">

<h2 id="done">0</h2>

<p>Done</p>

</div>

</div>

<div class="taskInput">

<input
id="title"
placeholder="Assignment">

<input
id="subject"
placeholder="Subject">

<input
id="date"
type="date">

<select
id="priority">

<option>High</option>

<option>Medium</option>

<option>Low</option>

</select>

<button
onclick="addTask()">

+ Add Task

</button>

</div>

<div
id="taskList">

</div>

</div>

<script
src="script.js">

</script>

</body>

</html>

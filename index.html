<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Planner Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar-card">
            <div class="header-inline">
                <div class="header">
                    <h1>Hello Sayantani 👋</h1>
                    <p>Track and manage your assignments</p>
                </div>
                <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">🌙</button>
            </div>

            <div class="progress-container">
                <div class="progress-labels">
                    <span>Completion Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="taskInput">
                <label class="input-label">Assignment Name</label>
                <input id="title" placeholder="e.g., Physics Lab Report">

                <label class="input-label">Subject</label>
                <input id="subject" placeholder="e.g., Applied Physics">

                <label class="input-label">Due Date</label>
                <input id="date" type="date">

                <label class="input-label">Priority Level</label>
                <select id="priority">
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>

                <button class="add-btn" onclick="addTask()">+ Add Task</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="stats-grid">
                <div class="card card-total">
                    <h2 id="total">0</h2>
                    <p>Total Tasks</p>
                </div>
                <div class="card card-pending">
                    <h2 id="pending">0</h2>
                    <p>Pending</p>
                </div>
                <div class="card card-done">
                    <h2 id="done">0</h2>
                    <p>Completed</p>
                </div>
            </div>

            <div class="toolbar-card">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input id="searchBar" placeholder="Search assignments..." oninput="filterAndRenderTasks()">
                </div>
                <div class="sort-box">
                    <label for="sortSelect">Sort By:</label>
                    <select id="sortSelect" onchange="filterAndRenderTasks()">
                        <option value="none">Default</option>
                        <option value="date">Due Date</option>
                        <option value="priority">Priority</option>
                        <option value="subject">Subject</option>
                    </select>
                </div>
            </div>

            <div class="task-board">
                <h2>Active Assignments 📋</h2>
                <div id="taskList"></div>
            </div>

            <div class="task-board completed-section">
                <h2>Completed Assignments 🎉</h2>
                <div id="completedTaskList"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

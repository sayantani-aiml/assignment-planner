<!DOCTYPE html>
<html>
<head>
    <title>Assignment Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>📚 Assignment Planner</h1>

<input id="title" placeholder="Assignment title">

<input id="subject" placeholder="Subject">

<input id="date" type="date">

<select id="priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>

<button onclick="addTask()">Add Assignment</button>

<ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
